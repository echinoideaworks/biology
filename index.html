    </span>
    <span class="brand-text">生命の系統 <em>図鑑</em></span>
  </a>
  <nav class="site-nav" aria-label="ページ">
    <a href="#/" data-nav="top">全体像</a>

  <div class="header-tools">

      <button data-level="adv" aria-pressed="false">発展も</button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

</aside>
<div class="scrim" id="scrim"></div>

<div class="search" id="search" aria-hidden="true">
  <div class="search-panel" role="dialog" aria-label="検索">
    <div class="search-tabs">
      <button class="on" data-tab="name">生物から探す</button>
      <button data-tab="trait">特徴から探す</button>
    </div>
    <input id="searchInput" type="search" placeholder="例：ひとで、ミミズ、Euglena" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
</div>
